
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#D4E9D4">
    <title>Monopoly AI Banker</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        body { 
          font-family: 'Outfit', sans-serif;
          background-color: #D4E9D4; /* Classic Board Green */
          background-image: radial-gradient(#bedbb3 1px, transparent 1px);
          background-size: 20px 20px;
          /* Native App Feel */
          user-select: none;
          -webkit-user-select: none;
          -webkit-tap-highlight-color: transparent;
          overflow-x: hidden;
          overscroll-behavior-y: none; /* Disable pull-to-refresh */
        }
        .monopoly-card {
          border: 3px solid #000;
          box-shadow: 6px 6px 0px 0px rgba(0,0,0,0.1);
        }
        .btn-monopoly {
          border: 2px solid #000;
          box-shadow: 4px 4px 0px 0px #000;
          transition: all 0.1s ease;
          touch-action: manipulation;
        }
        .btn-monopoly:active {
          transform: translate(2px, 2px);
          box-shadow: 1px 1px 0px 0px #000;
        }
        /* Ensure inputs still allow typing */
        input, select, textarea {
          user-select: text !important;
          -webkit-user-select: text !important;
        }
        .safe-pt { padding-top: var(--safe-top); }
        .safe-pb { padding-bottom: var(--safe-bottom); }
        .safe-mb { margin-bottom: var(--safe-bottom); }
    </style>
<script type="importmap">

  }
}
</script>

</head>

</body>
</html>
