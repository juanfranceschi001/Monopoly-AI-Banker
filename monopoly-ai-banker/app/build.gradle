import java.util.Properties

plugins {
    id 'com.android.application'
}

// Free-tier IDs and signing config, kept out of version control via
// local.properties. See README.md for how to obtain/set these.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

// AdMob. Falls back to Google's official test IDs (always safe to ship,
// never earn real revenue) until real ones are configured.
def admobAppId = localProperties.getProperty('ADMOB_APP_ID', 'ca-app-pub-3940256099942544~3347511713')
def admobBannerAdUnitId = localProperties.getProperty('ADMOB_BANNER_AD_UNIT_ID', 'ca-app-pub-3940256099942544/6300978111')

// Release signing, also kept out of version control via local.properties.
def releaseStoreFile = localProperties.getProperty('RELEASE_STORE_FILE', '')
def releaseStorePassword = localProperties.getProperty('RELEASE_STORE_PASSWORD', '')
def releaseKeyAlias = localProperties.getProperty('RELEASE_KEY_ALIAS', '')
def releaseKeyPassword = localProperties.getProperty('RELEASE_KEY_PASSWORD', '')

android {
    compileSdkVersion 36
    namespace "studio.ai.monopolyaibanker"

    defaultConfig {
        applicationId "studio.ai.monopolyaibanker"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 2
        versionName "1.1"

        manifestPlaceholders = [admobAppId: admobAppId]
        buildConfigField "String", "ADMOB_BANNER_AD_UNIT_ID", "\"${admobBannerAdUnitId}\""
        buildConfigField "String", "WEB_APP_URL", "\"https://franceschiindustries.com/monopoly-ai-banker/\""
    }

    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseStoreFile) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    lintOptions {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.android.gms:play-services-ads:23.5.0'
}
